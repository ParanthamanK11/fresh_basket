<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreshBasket</title>
<style>
:root{--bg:#f4f8ef;--card:#fff;--tx:#1b2b1e;--mu:#667a6a;--ac:#2a7a3b;--ac2:#e3f1de;--hi:#f2b705;--bd:#d9e4d3}
@media (prefers-color-scheme:dark){:root{--bg:#111812;--card:#1b251c;--tx:#e7efe4;--mu:#9bad9d;--ac:#6fcb80;--ac2:#243527;--bd:#2c3a2e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{padding:18px 16px 4px;max-width:900px;margin:auto}
h1{margin:0;font-size:24px}h3{margin:22px 0 0}
header p{margin:4px 0 0;color:var(--mu);font-size:14px}
nav{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;max-width:900px;margin:auto}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:20px;font-size:14px;white-space:nowrap;text-transform:capitalize;cursor:pointer}
.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:6px 16px;max-width:900px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:3px}
.card.out{opacity:.55}.card.wide{display:block;margin-bottom:10px}
.em{font-size:38px;line-height:1.1}.big{font-size:58px}
small,.mu{color:var(--mu);font-size:13px}.price{color:var(--ac);font-weight:700}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:700;text-decoration:none;display:inline-block;cursor:pointer}
.btn.sm{padding:8px;margin-top:4px}.btn.wide{width:100%;margin-top:12px}
.link{background:none;border:0;color:var(--ac);font-size:14px;cursor:pointer;padding:4px}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--ac2);border-radius:10px;margin-top:4px;font-weight:700}
.step button{border:0;background:none;color:var(--ac);font-size:22px;width:42px;height:36px;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--hi);font-weight:700}
.pad{padding:12px 16px;max-width:560px;margin:auto}.center{text-align:center}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}
.tot{font-size:18px}
label{display:block;font-size:13px;color:var(--mu);margin-top:10px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pr{width:76px;display:inline-block;margin:0;padding:6px}
.inl{display:inline;margin:0;color:var(--tx)}.inl input{width:auto;margin-right:4px}
footer{text-align:center;padding:20px;font-size:13px}a{color:var(--ac)}
</style></head>
<body><div id="app"><p class="pad mu">Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
// 1. Paste your Supabase values (Project Settings > API). The anon key is safe to put here.
var SB_URL='PASTE_PROJECT_URL',SB_KEY='PASTE_ANON_KEY';
var sb=supabase.createClient(SB_URL,SB_KEY);
var S={apts:[],prods:[],orders:[],wa:'',cust:{}},aptId=null,ready=false,msg='';
var cart={},cat='All',view='shop',lastOrder=null,tab='orders',authed=false;
try{S.cust=JSON.parse(localStorage.getItem('fb_cust'))||{}}catch(e){}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mapP(r){return{id:r.id,name:r.name,cat:r.category,unit:r.unit,price:+r.price,em:r.emoji||'🛒',stock:r.in_stock}}
function apt(){var h=location.hash.slice(1),m=S.apts.filter(function(x){return x.id==h})[0];if(m)aptId=m.id;return S.apts.filter(function(x){return x.id==aptId})[0]||S.apts[0]}
function lines(){return Object.keys(cart).map(function(id){return{p:S.prods.filter(function(x){return x.id==id})[0],q:cart[id]}}).filter(function(x){return x.p&&x.q>0})}
function total(){return lines().reduce(function(a,x){return a+x.p.price*x.q},0)}
function count(){return lines().reduce(function(a,x){return a+x.q},0)}
function go(v){view=v;msg='';render();window.scrollTo(0,0)}
function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);render()}
function setCat(c){cat=c;render()}

async function load(){
 var a=await sb.from('apartments').select('*').eq('active',true).order('name');
 var p=await sb.from('products').select('*').order('id');
 var s=await sb.from('settings').select('*');
 ready=true;
 if(a.error||p.error){msg='Could not load the shop. Check the Supabase URL and key in index.html.'}
 else{S.apts=a.data;S.prods=p.data.map(mapP);var cfg={};(s.data||[]).forEach(function(x){cfg[x.key]=x.value});S.wa=cfg.whatsapp||'';S.upi=cfg.upi_id||'';S.upn=cfg.upi_name||'FreshBasket'}
 render()}
async function loadOrders(){var r=await sb.from('orders').select('*,order_items(*)').order('id',{ascending:false});S.orders=r.data||[]}

function card(p){var q=cart[p.id]||0;
 var act=!p.stock?'<small>Out of stock</small>':q?'<div class="step"><button onclick="chg('+p.id+',-1)" aria-label="Remove one">−</button><span>'+q+'</span><button onclick="chg('+p.id+',1)" aria-label="Add one">+</button></div>':'<button class="btn sm" onclick="chg('+p.id+',1)">Add</button>';
 return '<div class="card '+(p.stock?'':'out')+'"><div class="em">'+p.em+'</div><b>'+esc(p.name)+'</b><small>'+esc(p.unit)+'</small><span class="price">₹'+p.price+'</span>'+act+'</div>'}

function shop(){
 var a=apt();if(!a)return '<main class="pad"><h1>FreshBasket</h1><p class="mu">'+esc(msg||'No apartments are open for delivery yet.')+'</p></main>';
 var cats=['All'].concat(S.prods.map(function(p){return p.cat}).filter(function(c,i,x){return x.indexOf(c)==i}));
 var list=S.prods.filter(function(p){return cat=='All'||p.cat==cat}),n=count();
 return '<header><h1>🥬 FreshBasket</h1><p>'+esc(a.name)+'<br>Order by '+esc(a.cutoff)+' for delivery tomorrow, '+esc(a.slot)+'.</p><button class="link" onclick="go(\'track\')">Track my order</button></header>'
 +'<nav>'+cats.map(function(c){return '<button class="chip '+(c==cat?'on':'')+'" onclick="setCat(\''+c+'\')">'+c+'</button>'}).join('')+'</nav>'
 +'<main class="grid">'+list.map(card).join('')+'</main>'
 +(n?'<div class="bar"><span>'+n+' items, ₹'+total()+'</span><button class="btn" onclick="go(\'checkout\')">View cart</button></div>':'')}

function checkout(){var c=S.cust;
 return '<header><button class="link" onclick="go(\'shop\')">Back to products</button><h1>Your order</h1></header><main class="pad">'
 +lines().map(function(x){return '<div class="row"><span>'+x.p.em+' '+esc(x.p.name)+' × '+x.q+'</span><b>₹'+x.p.price*x.q+'</b></div>'}).join('')
 +'<div class="row tot"><span>Total</span><b>₹'+total()+'</b></div>'
 +'<label>Name<input id="nm" value="'+esc(c.name)+'"></label>'
 +'<label>Phone number<input id="ph" inputmode="numeric" maxlength="10" value="'+esc(c.phone)+'"></label>'
 +'<div class="two"><label>Block or tower<input id="bl" value="'+esc(c.block)+'"></label><label>Flat number<input id="fl" value="'+esc(c.flat)+'"></label></div>'
 +'<label>Payment<select id="pm"><option>Cash on delivery</option><option>UPI (pay now)</option></select></label>'
 +'<p class="mu" id="err" role="alert"></p><button class="btn wide" id="pb" onclick="place()">Place order</button></main>'}

async function place(){
 var g=function(i){return $(i).value.trim()},c={name:g('nm'),phone:g('ph'),block:g('bl'),flat:g('fl')};
 if(!c.name||!/^\d{10}$/.test(c.phone)||!c.flat){$('err').textContent='Enter your name, a 10-digit phone number and your flat number.';return}
 $('pb').disabled=true;$('err').textContent='Placing your order…';
 var L=lines(),pay=g('pm');
 var r=await sb.rpc('place_order',{p_apt:apt().id,p_name:c.name,p_phone:c.phone,p_block:c.block,p_flat:c.flat,p_pay:pay,items:L.map(function(x){return{id:x.p.id,q:x.q}})});
 if(r.error){$('pb').disabled=false;$('err').textContent='Could not place the order. Please try again.';return}
 S.cust=c;try{localStorage.setItem('fb_cust',JSON.stringify(c));localStorage.setItem('fb_last',JSON.stringify({id:r.data,phone:c.phone}))}catch(e){}
 lastOrder={id:r.data,c:c,pay:pay,total:total(),L:L,ps:'Pending'};cart={};go('done')}

function done(){var o=lastOrder;
 var m='New order #'+o.id+'\n'+o.c.name+', '+o.c.phone+'\n'+o.c.block+' '+o.c.flat+', '+apt().name+'\n'
  +o.L.map(function(x){return x.p.name+' ('+x.p.unit+') x '+x.q}).join('\n')+'\nTotal Rs '+o.total+', '+o.pay;
 return '<main class="pad center"><div class="em big">✅</div><h2>Order placed</h2><p>Order #'+o.id+', ₹'+o.total+'<br>Delivery tomorrow, '+esc(apt().slot)+'.</p>'
 +payPanel(o.id,o.c.phone,o.total,o.pay,o.ps)+(S.wa?'<a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+S.wa+'?text='+encodeURIComponent(m)+'">Send order on WhatsApp</a><br><br>':'')
 +'<button class="btn" onclick="trackNow()">Track this order</button><br><br><button class="link" onclick="go(\'shop\')">Order more</button></main>'}

async function login(){var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 if(r.error){msg='Wrong email or password.'}else{authed=true;msg='';await loadOrders()}render()}
async function logout(){await sb.auth.signOut();authed=false;render()}

function admin(){
 if(!authed)return '<main class="pad"><h1>Owner login</h1><label>Email<input id="em" type="email"></label><label>Password<input id="pw" type="password"></label><p class="mu">'+esc(msg)+'</p><button class="btn wide" onclick="login()">Sign in</button></main>';
 var tabs=['orders','products','shopping list'].map(function(t){return '<button class="chip '+(t==tab?'on':'')+'" onclick="tab=\''+t+'\';render()">'+t+'</button>'}).join('');
 return '<header><h1>Admin</h1><button class="link" onclick="logout()">Sign out</button></header><nav>'+tabs+'</nav><main class="pad">'+(tab=='orders'?ords():tab=='products'?prods():shopl())+'</main>'}

async function setPay(id,v){await sb.from('orders').update({payment_status:v}).eq('id',id);await loadOrders();render()}
async function setCfg(k,v){await sb.from('settings').upsert({key:k,value:v});await load()}
function payPanel(id,phone,total,pay,ps){
 if(!/UPI/.test(pay))return '';
 if(!S.upi)return '<p class="mu">Please pay by UPI on delivery.</p>';
 if(ps=='Received')return '<p><b>✅ Payment received. Thank you!</b></p>';
 var link='upi://pay?pa='+encodeURIComponent(S.upi)+'&pn='+encodeURIComponent(S.upn)+'&am='+total+'&cu=INR&tn='+encodeURIComponent('FreshBasket order '+id);
 var qr='';try{var q=qrcode(0,'M');q.addData(link);q.make();qr=q.createSvgTag(4,2)}catch(e){}
 return '<div class="card wide"><b>Pay ₹'+total+' by UPI</b><p class="mu">Pay to <b>'+esc(S.upi)+'</b> ('+esc(S.upn)+')</p>'
 +'<a class="btn" href="'+esc(link)+'">Pay with UPI app</a>'
 +'<div style="margin:10px 0;background:#fff;display:inline-block;padding:6px;border-radius:8px">'+qr+'</div>'
 +(ps=='Customer says paid'?'<p><b>Thanks! We are checking your payment.</b></p>':'<label>UPI reference number (optional)<input id="ur" maxlength="30"></label><button class="btn wide" onclick="paid('+id+',\''+phone+'\')">I have paid</button>')+'</div>'}
async function paid(id,phone){
 var r=await sb.rpc('mark_paid',{p_id:id,p_phone:phone,p_ref:($('ur')||{}).value||''});
 if(r.error||r.data!='ok'){alert('Could not record your payment note. Please message the shop.');return}
 if(lastOrder&&lastOrder.id==id)lastOrder.ps='Customer says paid';
 if(trk&&trk.id==id)trk.payment_status='Customer says paid';
 render()}
function waLink(o){
 var st={'Placed':'has been received','Packed':'is packed','Out for delivery':'is out for delivery','Delivered':'has been delivered'}[o.status]||'is being processed';
 var m=o.status=='Cancelled'
  ?'Hi '+o.customer_name+', your FreshBasket order #'+o.id+' has been cancelled. Sorry for the inconvenience. You are welcome to place a new order anytime.'
  :'Hi '+o.customer_name+', your FreshBasket order #'+o.id+' '+st+'. Total Rs '+o.total+'.'+(o.payment_status=='Received'?' We have received your UPI payment.':'')+' Thank you!';
 return 'https://wa.me/91'+o.phone+'?text='+encodeURIComponent(m)}
function ords(){
 if(!S.orders.length)return '<p class="mu">No orders yet.</p>';
 return S.orders.map(function(o){
  return '<div class="card wide"><b>#'+o.id+', ₹'+o.total+'</b> <small>'+esc(new Date(o.created_at).toLocaleString())+'</small><br>'+esc(o.customer_name)+', <a href="tel:'+esc(o.phone)+'">'+esc(o.phone)+'</a><br>'+esc(o.block)+' '+esc(o.flat)+', '+esc(o.apartment_id)+', '+esc(o.payment)+(/UPI/.test(o.payment)?' ('+esc(o.payment_status)+')'+(o.upi_ref?', ref '+esc(o.upi_ref):''):'')
  +'<br><small>'+o.order_items.map(function(l){return esc(l.product_name)+' × '+l.qty}).join(', ')+'</small>'
  +(o.status=='Cancelled'?'<br><small>Cancelled. Reason: '+esc(o.cancel_reason||'not given')+'</small>':'')
  +'<select onchange="setStatus('+o.id+',this.value)">'+['Placed','Packed','Out for delivery','Delivered','Cancelled'].map(function(s){return '<option '+(s==o.status?'selected':'')+'>'+s+'</option>'}).join('')+'</select>'+(/UPI/.test(o.payment)?'<select onchange="setPay('+o.id+',this.value)">'+['Pending','Customer says paid','Received'].map(function(x){return '<option '+(x==o.payment_status?'selected':'')+'>'+x+'</option>'}).join('')+'</select>':'')+'<a class="btn sm" target="_blank" rel="noopener" href="'+waLink(o)+'">Message customer on WhatsApp</a></div>'}).join('')}
async function setStatus(id,v){await sb.from('orders').update({status:v}).eq('id',id);await loadOrders();render()}

function shopl(){var m={};
 S.orders.filter(function(o){return o.status=='Placed'}).forEach(function(o){o.order_items.forEach(function(l){var k=l.product_name+' ('+l.unit+')';m[k]=(m[k]||0)+l.qty})});
 var k=Object.keys(m);if(!k.length)return '<p class="mu">Nothing to buy right now.</p>';
 return '<p class="mu">Total to buy for orders still marked Placed.</p>'+k.map(function(x){return '<div class="row"><span>'+esc(x)+'</span><b>× '+m[x]+'</b></div>'}).join('')}

function prods(){
 return S.prods.map(function(p){
  return '<div class="row"><span>'+p.em+' '+esc(p.name)+' <small>'+esc(p.unit)+'</small></span><span>₹<input class="pr" type="number" value="'+p.price+'" onchange="upd('+p.id+',{price:+this.value})"> <label class="inl"><input type="checkbox" '+(p.stock?'checked':'')+' onchange="upd('+p.id+',{in_stock:this.checked})">in stock</label> <button class="link" aria-label="Delete" onclick="delp('+p.id+')">✕</button></span></div>'}).join('')
 +'<h3>Add a product</h3><div class="two"><label>Name<input id="an"></label><label>Price (₹)<input id="ap" type="number"></label><label>Unit<input id="au" value="500 g"></label><label>Category<select id="ac"><option>Vegetables</option><option>Greens</option><option>Dairy</option></select></label></div><button class="btn wide" onclick="addp()">Add product</button>'
 +'<h3>Your UPI ID</h3><input value="'+esc(S.upi)+'" placeholder="yourname@bank" onchange="setCfg(\'upi_id\',this.value.trim())"><label>Name shown to customers<input value="'+esc(S.upn)+'" onchange="setCfg(\'upi_name\',this.value.trim())"></label><p class="mu">Customers see this, with a QR code, when they choose UPI.</p><h3>Your WhatsApp number</h3><input value="'+esc(S.wa)+'" onchange="setWa(this.value)"><p class="mu">Include the country code, for example 919876543210.</p>'}
async function upd(id,v){await sb.from('products').update(v).eq('id',id);await load()}
async function delp(id){await sb.from('products').delete().eq('id',id);await load()}
async function setWa(v){await sb.from('settings').upsert({key:'whatsapp',value:v.replace(/\D/g,'')});await load()}
async function addp(){var n=$('an').value.trim(),p=+$('ap').value,c=$('ac').value;if(!n||!p)return;
 await sb.from('products').insert({name:n,category:c,unit:$('au').value.trim()||'1 pc',price:p,emoji:{Vegetables:'🥕',Greens:'🌿',Dairy:'🥛'}[c]});await load()}

var trk=null,trkMsg='',tid='',tph='';
function track(){
 var l={};try{l=JSON.parse(localStorage.getItem('fb_last'))||{}}catch(e){}
 var steps=['Placed','Packed','Out for delivery','Delivered'],body='';
 if(trk){var i=steps.indexOf(trk.status);
  body='<div class="card wide" style="margin-top:16px"><b>Order #'+trk.id+', ₹'+trk.total+'</b><br><small>'+esc(new Date(trk.created_at).toLocaleString())+(trk.slot?', delivery '+esc(trk.slot):'')+'</small>'
  +(trk.status=='Cancelled'
   ?'<p><b>❌ This order was cancelled.</b>'+(trk.cancel_reason?'<br><small>Reason: '+esc(trk.cancel_reason)+'</small>':'')+'</p><p class="mu">You are welcome to place a new order anytime.</p>'
   :steps.map(function(s,k){return '<div class="row"><span>'+(k<=i?'✅':'⬜')+' '+s+'</span></div>'}).join(''))
  +'<small>'+trk.items.map(function(x){return esc(x.name)+' ('+esc(x.unit)+') × '+x.qty}).join(', ')+'</small>'
  +(trk.status!='Cancelled'?payPanel(trk.id,tph,trk.total,trk.payment,trk.payment_status):'')+(trk.status=='Placed'?'<label>Reason for cancelling (optional)<input id="cr" maxlength="200"></label><button class="btn wide" style="background:#b3261e;color:#fff" onclick="doCancel()">Cancel this order</button><p class="mu">You can cancel until the order is packed.</p>':'')
  +'</div>'}
 return '<header><button class="link" onclick="go(\'shop\')">Back to products</button><h1>Track my order</h1></header><main class="pad">'
 +'<label>Order number<input id="to" inputmode="numeric" value="'+esc(tid||l.id||'')+'"></label>'
 +'<label>Phone number used for the order<input id="tp" inputmode="numeric" maxlength="10" value="'+esc(tph||l.phone||S.cust.phone||'')+'"></label>'
 +'<p class="mu" role="alert">'+esc(trkMsg)+'</p><button class="btn wide" onclick="doTrack()">Check status</button>'+body+'</main>'}
async function doTrack(){
 tid=$('to').value.replace(/\D/g,'');tph=$('tp').value.trim();trk=null;
 if(!tid||!/^\d{10}$/.test(tph)){trkMsg='Enter your order number and your 10-digit phone number.';render();return}
 var r=await sb.rpc('track_order',{p_id:+tid,p_phone:tph});
 if(r.error||!r.data){trkMsg='No order found. Please check the order number and phone number.'}else{trk=r.data;trkMsg=''}
 render()}
async function doCancel(){
 if(!confirm('Cancel order #'+tid+'? This cannot be undone.'))return;
 var r=await sb.rpc('cancel_order',{p_id:+tid,p_phone:tph,p_reason:$('cr').value});
 var m={cancelled:'Your order has been cancelled. You are welcome to place a new order anytime.',already_cancelled:'This order is already cancelled.',too_late:'Sorry, this order is already packed or on its way, so it can no longer be cancelled. Please message the shop.',not_found:'No order found.'};
 trkMsg=r.error?'Could not cancel. Please try again.':(m[r.data]||'Could not cancel.');
 var t=await sb.rpc('track_order',{p_id:+tid,p_phone:tph});
 trk=(t.error||!t.data)?null:t.data;render()}
function trackNow(){tid=lastOrder.id;tph=lastOrder.c.phone;go('track');doTrack()}
function render(){
 if(!ready)return;
 var h=location.hash=='#admin',v=h?'admin':(view=='admin'?'shop':view);
 var views={shop:shop,checkout:checkout,done:done,admin:admin,track:track};
 $('app').innerHTML=views[v]()+((v=='shop'||h)?'<footer>'+(h?'<a href="#">Back to customer view</a>':'<a href="#admin">Shop owner login</a>')+'</footer>':'')}
window.addEventListener('hashchange',async function(){if(location.hash=='#admin'&&authed)await loadOrders();render()});
sb.auth.getSession().then(async function(r){if(r.data.session){authed=true;await loadOrders()}load()});
</script></body></html>
